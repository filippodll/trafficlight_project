<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Road Network Visualization with Directed Edges</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
    #map { width: 100%; height: 100vh; position: absolute; top: 0; left: 0; }
    .slider-container {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 1000; width: 80%; padding: 10px; background: rgba(255, 255, 255, 0.8);
    }
    .slider-container input { width: 100%; }
    circle { fill: black; stroke: white; stroke-width: 1; }
    path { fill: none; stroke-width: 4; }
    marker { fill: black; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="slider-container">
    <label for="timeSlider">Time Step:</label>
    <input type="range" id="timeSlider" min="0" step="300" value="0" />
    <span id="timeLabel">Time Step: 0</span>
  </div>

  <script>
    const map = L.map('map').setView([44.4949, 11.3426], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>'
    }).addTo(map);
    L.svg().addTo(map);

    const overlay = d3.select(map.getPanes().overlayPane).select("svg");
    const g = overlay.append("g").attr("class", "leaflet-zoom-hide");
    let nodes, edges, densities, timeStep = 0;

    Promise.all([
      d3.dsv(";", "./visual_data/nodes.csv", parseNodes),
      d3.dsv(";", "./visual_data/edges.csv", parseEdges),
      d3.dsv(";", "./visual_data/densities.csv", parseDensity)
    ]).then(([nodesData, edgesData, densityData]) => {
      nodes = nodesData;
      edges = edgesData;
      densities = densityData;
      const nodeMap = new Map(nodes.map(d => [d.id, d]));
      edges = edges.filter(d => nodeMap.has(d.u) && nodeMap.has(d.v));

      const colorScale = d3.scaleLinear().domain([0, 0.5, 1]).range(["green", "yellow", "red"]);
      const lineGenerator = d3.line().x(d => d[0]).y(d => d[1]);

      const marker = overlay.append("defs").append("marker")
        .attr("id", "arrowhead")
        .attr("viewBox", "0 -5 10 10")
        .attr("refX", 10)
        .attr("refY", 0)
        .attr("markerWidth", 6)
        .attr("markerHeight", 6)
        .attr("orient", "auto")
        .append("path")
        .attr("d", "M0,-5L10,0L0,5")
        .attr("fill", "black");

      function project(d) { return map.latLngToLayerPoint([d.y, d.x]); }

      const link = g.selectAll("path")
        .data(edges)
        .enter()
        .append("path")
        .attr("stroke", "white")
        .attr("stroke-width", 3)
        .attr("marker-end", "url(#arrowhead)");

      const node = g.selectAll("circle")
        .data(nodes)
        .enter()
        .append("circle")
        .attr("r", 3)
        .attr("fill", "blue");

      function update() {
        nodes.forEach(d => d.projected = project(d));
        link.attr("d", d => {
          const start = project(nodeMap.get(d.u));
          const end = project(nodeMap.get(d.v));
          const midX = (start.x + end.x) / 2 + (start.y - end.y) * 0.15;
          const midY = (start.y + end.y) / 2 + (end.x - start.x) * 0.15;
          return lineGenerator([[start.x, start.y], [midX, midY], [end.x, end.y]]);
        });
        node.attr("cx", d => d.projected.x).attr("cy", d => d.projected.y);
        updateDensityVisualization();
      }

      function updateDensityVisualization() {
        const currentDensityRow = densities.find(d => d.time === timeStep);
        if (!currentDensityRow) return;
        const currentDensities = currentDensityRow.densities;
        edges.forEach((edge, index) => {
          let density = currentDensities[index] || 0;
          link.filter((d, i) => i === index).attr("stroke", colorScale(density));
        });
      }

      map.on("zoomend", update);
      update();

      const timeSlider = document.getElementById('timeSlider');
      const timeLabel = document.getElementById('timeLabel');
      timeSlider.max = Math.ceil(d3.max(densities, d => d.time) / 300) * 300;
      timeSlider.addEventListener('input', function() {
        timeStep = parseInt(timeSlider.value);
        timeLabel.textContent = `Time Step: ${timeStep}`;
        update();
      });
    });

    function parseNodes(d) { return { id: d.id, x: +d.x, y: +d.y }; }
    function parseEdges(d) { return { osm_id: d.id, u: d.source, v: d.target, name: d.name }; }
    function parseDensity(d) {
      return { time: +d.time, densities: Object.keys(d).filter(k => k !== 'time').map(k => +d[k] || 0) };
    }
  </script>
</body>
</html>
